name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
      - run: go test ./... -race -cover
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No generated-text punctuation
        run: |
          # Same check as merlin's: byte escapes so this file does not trip
          # itself, -I so the PNGs never match by chance.
          em=$'\342\200\224' ell=$'\342\200\246'
          ldq=$'\342\200\234' rdq=$'\342\200\235'
          if grep -rnI --exclude-dir=.git -e "$em" -e "$ell" -e "$ldq" -e "$rdq" . ; then
            echo "::error::Found em dashes, ellipsis characters or curly quotes. Use plain punctuation."
            exit 1
          fi

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
