# Pinned, not taken from the directory name: the volume is always
# skua_pgdata, so a deploy from any other directory (a new host, a renamed
# checkout) finds the same database instead of silently starting an empty one.
name: skua

services:
  bot:
    # Pinned to the exact commit CI built. Rollback, on foundry as deploy:
    #   cd ~/skua && cp previous-tag.env deployed-tag.env
    #   set -a; . ./deployed-tag.env; set +a
    #   docker compose -f docker-compose.prod.yml up -d
    image: ghcr.io/6586x57890143/skua:${SKUA_IMAGE_TAG:-latest}
    read_only: true
    cap_drop:
      - ALL
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    # Also what makes an intent change in the Developer Portal take effect:
    # skua exits cleanly when it sees one and comes back re-identified.
    restart: unless-stopped
    # A deploy stops the old bot with SIGTERM: it closes the gateway and
    # waits up to 25s for preen's owed removals and fills (drainBy in main)
    # before Docker's SIGKILL.
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: skua
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
    restart: unless-stopped
    mem_limit: 256m

  # x and tiktok for notify: they have no free API, so an RSSHub reads them
  # and skua reads its feeds at SKUA_NOTIFY_RSSHUB=http://rsshub:1200. Only
  # on compose's network, and only with COMPOSE_PROFILES=rsshub in .env.
  # Only the one variable it needs is passed, never skua's .env.
  rsshub:
    # Pinned to the build checked against tiktok, by tag and digest, so a
    # deploy or a rollback pulls exactly this. Bump both together.
    image: diygod/rsshub:2026-10-07@sha256:7e2cbe4862d94480e927737cf52f5d8e0c60f14b79d2fc2f02ae6f698b51e75a
    profiles: [rsshub]
    environment:
      NODE_ENV: production
      CACHE_EXPIRE: "120"
      # The auth_token cookie of a throwaway x account; x refuses logged-out
      # reads. Unset, x fails and tiktok still works.
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
    restart: unless-stopped
    mem_limit: 384m

volumes:
  pgdata:
