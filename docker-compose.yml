# Local development: bot + Postgres. `docker compose up --build`.
services:
  bot:
    build: .
    env_file: .env
    environment:
      SKUA_DATABASE_URL: postgres://skua:skua@postgres:5432/skua?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skua
      POSTGRES_PASSWORD: skua
      POSTGRES_DB: skua
    ports:
      - "127.0.0.1:${SKUA_PG_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skua"]
      interval: 5s
